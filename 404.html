<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - Stackly Event Platform</title>
  <meta name="description" content="Sorry, the requested exhibition hall or page could not be located.">
  <!-- Fonts & Styles -->
  <link rel="stylesheet" href="css/style.css?v=7.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 404 Content Container -->
  <main class="error-page-container">
    
    <div class="error-number">404</div>
    
    <!-- CSS illustration of a megaphone / empty stand -->
    <div style="font-size: 5rem; margin-bottom: 20px; color: var(--accent-gold); animation: float 3s ease-in-out infinite;">
      <i class="fa-solid fa-person-shelter"></i>
    </div>
    
    <h1 class="error-message" style="color:var(--white); font-size: 2rem;">Lost in the Exhibition Hall?</h1>
    <p class="error-description">The exhibition booth, schedule sheet, or administrative portal you are searching for is in a different sector or hasn't opened yet!</p>
    
    <div class="error-btns">
      <button onclick="window.history.back()" class="btn btn-secondary" style="border-color:var(--white); color:var(--white);"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
    </div>
    
  </main>

  <!-- Script for basic active state clearing -->
  <script src="js/script.js?v=7.0"></script>
</body>
</html>
